name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that pinshelf makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. If you have alternatives, list them.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Saving bookmarks
        - Organizing (tags, collections)
        - Search
        - Import / export
        - Browser extension
        - Self-hosting / deployment
        - Other
    validations:
      required: true
