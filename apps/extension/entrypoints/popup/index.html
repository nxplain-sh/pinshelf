<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pinshelf</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #131110;
        --surface: #1a1715;
        --surface-hover: #221e1b;
        --line: #2e2925;
        --line-strong: #4a423a;
        --ink: #f2ece2;
        --ink-muted: #b3a99b;
        --ink-faint: #837a6d;
        --accent: #c9a227;
        --danger: #d2604f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        background: var(--canvas);
        color: var(--ink);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .muted {
        color: var(--ink-faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .title {
        font-size: 13px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .url {
        color: var(--ink-faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .field {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 6px 8px;
        font-size: 12px;
      }
      .field:focus {
        outline: none;
        border-color: var(--line-strong);
      }
      .field::placeholder {
        color: var(--ink-faint);
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-primary {
        border: 0;
        border-radius: 6px;
        background: var(--ink);
        color: var(--canvas);
        font-weight: 500;
        font-size: 13px;
        padding: 7px 14px;
        cursor: pointer;
      }
      .btn-primary:disabled {
        opacity: 0.4;
      }
      .label {
        color: var(--ink-faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        text-transform: uppercase;
      }
      .message-ok {
        color: var(--accent);
      }
      .message-error {
        color: var(--danger);
      }
      .link {
        background: none;
        border: 0;
        color: var(--ink-muted);
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
